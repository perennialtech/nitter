name: Fork commit tracker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fork-commit-tracker

jobs:
  track:
    if: github.repository == 'perennialtech/nitter'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Post new commits
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKER_ISSUE: '38'
        run: python3 tools/track_fork_commits.py
