[Server]
hostname = "nitter.net"      # for generating links, change this to your own domain/ip
title = "nitter"
address = "0.0.0.0"
port = 8080
https = false                # disable to enable cookies when not using https
staticDir = "./public"

[Cache]
listMinutes = 240            # how long to cache list info (not the tweets, so keep it high)
rssMinutes = 10              # how long to cache rss queries
redisHost = "localhost"      # Change to "nitter-redis" if using docker-compose
redisPort = 6379
redisPassword = ""
redisConnections = 20        # minimum open connections in pool
redisMaxConnections = 30
# new connections are opened when none are available, but if the pool size
# goes above this, they're closed when released. don't worry about this unless
# you receive tons of requests per second

[Config]
hmacKey = "secretkey"        # CHANGE THIS to a unique random value (e.g. `openssl rand -hex 32`); signs media urls
base64Media = false          # use base64 encoding for proxied media urls
enableRSS = true             # master switch, set to false to disable all RSS feeds
enableRSSUserTweets = true   # /@user/rss
enableRSSUserReplies = true  # /@user/with_replies/rss
enableRSSUserReposts = true  # /@user/reposts/rss
enableRSSUserMedia = true    # /@user/media/rss
enableRSSUserArticles = true # /@user/articles/rss
enableRSSSearch = true       # /search/rss and /@user/search/rss
enableRSSList = true         # list RSS feeds
enableRSSCommunityNotes = true # /i/communitynotes/rss and /i/communitynotes/new/rss
enableTrends = false         # show a trending-topics panel on the homepage
trendsTab1Name = "United States" # label for the first tab (shown by default on load)
trendsTab1Woeid = 23424977   # WOEID for the first tab
trendsTab2Name = "Worldwide" # label for the second tab
trendsTab2Woeid = 1          # WOEID for the second tab, 1 = worldwide
trendsCacheMinutes = 15      # how long to cache each WOEID's trends list
trendsMaxItems = 15          # how many trends to show per tab (max returned by the API is ~50)
enableDebug = false          # enable request logs and debug endpoints (/.sessions)
showCommunityNotesNav = true # show group icon in navbar that links to birdwatch page
showRetweetTime = true       # show retweet timestamp/permalink next to "user retweeted"
enableTranslation = true     # "See translation" links and translated tweets/community notes
onDemandTranslation = false  # EXPERIMENTAL: "Translate to <lang>" link on translatable tweets and notes. needs enableTranslation
onDemandTranslationLang = "en" # target language for onDemandTranslation
guestAuth = false            # requires NITTER_GUEST_BEARER_TOKEN (token without the Bearer prefix)
guestPoolSize = 1
proxy = ""                   # http/https url, SOCKS proxies are not supported
proxyAuth = ""
apiProxy = ""                # nitter-proxy host, e.g. localhost:7000
disableTid = false           # enable this if cookie-based auth is failing
maxConcurrentReqs = 2        # max requests at a time per session to avoid race conditions
maxRetries = 1               # max number of retries on rate limit errors
retryDelayMs = 150           # delay in ms between retries
apiTimeoutMs = 15000         # per-phase upstream API timeout; closes stalled sockets

# Change default preferences here, see src/prefs_impl.nim for a complete list
[Preferences]
theme = "Nitter"
replaceTwitter = "nitter.net"
replaceYouTube = "piped.video"
replaceReddit = "teddit.net"
abbreviateStats = false
proxyVideos = true
hlsPlayback = false
infiniteScroll = false
